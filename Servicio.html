<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servicio | Maldivas</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
    body { background:#080808; color:white; min-height:100vh; display:flex; justify-content:center; align-items:center; text-align:center; padding:25px; }
    .contenedor { width:100%; max-width:850px; background:#111; border:1px solid #6f5b1d; border-radius:20px; padding:40px 25px; }
    h1 { color:#d4af37; font-size:38px; margin-bottom:8px; }
    .precio { color:white; font-size:24px; margin-bottom:35px; }
    .columnas { display:grid; grid-template-columns:1fr 1fr; gap:25px; }
    .columna { background:#181818; border:1px solid #333; border-radius:18px; padding:25px 20px; }
    .columna h2 { color:#d4af37; font-size:22px; margin-bottom:25px; }
    .pago { display:block; width:100%; padding:16px 10px; margin:13px 0; border:1px solid #d4af37; border-radius:30px; background:#111; color:#d4af37; text-decoration:none; font-weight:bold; font-size:16px; }
    .pago:hover { background:#d4af37; color:#000; }
    .mercadopago { background:#d4af37; color:#000; }
    .mercadopago:hover { background:white; }
    .volver { display:inline-block; margin-top:30px; color:#d4af37; text-decoration:none; }
    @media(max-width:600px) {
      .columnas { grid-template-columns:1fr 1fr; gap:10px; }
      .contenedor { padding:30px 12px; }
      .columna { padding:20px 10px; }
      .columna h2 { font-size:17px; }
      .pago { font-size:13px; padding:14px 5px; }
    }
  
    /* Colores identificativos de cada método de pago */
    .transferencia { background:linear-gradient(90deg,rgba(30,110,200,.30),rgba(30,110,200,.08)) !important; border-color:#4da3ff !important; }
    .debito { background:linear-gradient(90deg,rgba(0,170,210,.30),rgba(0,170,210,.08)) !important; border-color:#37d5f5 !important; }
    .credito { background:linear-gradient(90deg,rgba(125,75,190,.32),rgba(125,75,190,.08)) !important; border-color:#a879e8 !important; }
    .efectivo { background:linear-gradient(90deg,rgba(40,150,75,.32),rgba(40,150,75,.08)) !important; border-color:#54c878 !important; }
    .mercadopago { background:#e0b82f !important; color:#000 !important; border-color:#e0b82f !important; }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YR99KQKFZ4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YR99KQKFZ4');
  </script>
</head>
<body>
  <div class="contenedor">
    <h1 id="servicio">Servicio</h1>
    <div class="precio" id="precio">$0</div>

    <div class="columnas">
      <div class="columna">
        <h2>🏪 EN EL LOCAL</h2>
        <a id="local-transferencia" class="pago transferencia" href="#">🏦 TRANSFERENCIA</a>
        <a id="local-debito" class="pago debito" href="#">💳 DÉBITO</a>
        <a id="local-credito" class="pago credito" href="#">💳 CRÉDITO</a>
        <a id="local-efectivo" class="pago efectivo" href="#">💵 EFECTIVO</a>
      </div>

      <div class="columna">
        <h2>🌐 POR WEB</h2>
        <a id="pagar-online" href="#" class="pago mercadopago">🟡 MERCADO PAGO</a>
      </div>
    </div>

    <a href="Citas.html" class="volver">← Volver a servicios</a>
  </div>

  <script>
    const datos = {
      brushing: { nombre: "Brushing", precio: "$500" },
      corte: { nombre: "Corte", precio: "$300" },
      lavado: { nombre: "Lavado", precio: "$400" },
      secado: { nombre: "Secado", precio: "$450" },
      alisado: { nombre: "Alisado", precio: "$1500" },
      color: { nombre: "Color", precio: "$1800" }
    };

    const parametros = new URLSearchParams(window.location.search);
    const servicio = parametros.get("servicio");

    const metodosLocal = ["transferencia", "debito", "credito", "efectivo"];
    metodosLocal.forEach(metodo => {
      const enlace = document.getElementById("local-" + metodo);
      enlace.href = "AgendarLocal.html?servicio=" + encodeURIComponent(servicio || "") + "&metodo=" + encodeURIComponent(metodo);
    });

    const pagarOnline = document.getElementById("pagar-online");
    if (datos[servicio]) {
      pagarOnline.href = "PagarOnline.html?servicio=" + encodeURIComponent(servicio);
    } else {
      pagarOnline.style.display = "none";
    }

    if (datos[servicio]) {
      document.getElementById("servicio").textContent = datos[servicio].nombre;
      document.getElementById("precio").textContent = datos[servicio].precio;
    }
  </script>
</body>
</html>
