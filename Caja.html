<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caja | Maldivas_Studio</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif;padding:22px}.wrap{max-width:850px;margin:auto}h1,h2{color:#d4af37}.login,.panel{background:#111;border:1px solid #6f5b1d;border-radius:18px;padding:22px}.login{max-width:430px;margin:10vh auto}input,button{padding:13px;border-radius:12px;border:1px solid #555;background:#181818;color:#fff;font-size:16px}input{width:100%;margin:7px 0}button{cursor:pointer}.gold{background:#d4af37;color:#000;border:0;font-weight:bold}.top{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.turno{display:grid;grid-template-columns:1.4fr 1fr .7fr;gap:10px;align-items:center;padding:14px 8px;border-bottom:1px solid #292929}.nombre{font-weight:bold;cursor:pointer;padding:11px;border-radius:10px;background:#191919}.attended .nombre{background:#153b22}.no_show .nombre{background:#4a1818}.pending .nombre{background:#292929}.estado{font-size:13px;color:#bbb}.total{font-size:30px;color:#d4af37;font-weight:bold;margin:22px 0}.hide{display:none}.msg{margin:12px 0;color:#ddd}@media(max-width:600px){.turno{grid-template-columns:1fr}.turno>*{width:100%}}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<div class="wrap"><div id="login" class="login"><h1>Maldivas_Studio</h1><p>Acceso a caja</p><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Contraseña"><button class="gold" id="entrar">ENTRAR</button><div id="loginMsg" class="msg"></div></div>
<div id="panel" class="panel hide"><div class="top"><div><h1>Caja</h1><input id="fechaReal" type="date" style="position:absolute;opacity:0;pointer-events:none"><button id="fecha" type="button" style="width:140px">--/--</button></div><button id="salir">Cerrar sesión</button></div><p>👆 Tocá el nombre: <b>1 vez = ✅ fue</b>, <b>2 veces = ❌ no fue</b>. Un tercer toque vuelve a pendiente.</p><div id="lista"></div><div id="total" class="total">$0</div><button class="gold" id="cerrar">CERRAR CAJA</button><div id="msg" class="msg"></div></div></div>
<script>
const sb=supabase.createClient("https://ejbooxbgrtunoehcxxip.supabase.co","sb_publishable_xwYodv3gbRBhyKE1d_NEUw_le_jfPfq");
const login=document.getElementById("login"),panel=document.getElementById("panel"),fecha=document.getElementById("fechaReal"),fechaBtn=document.getElementById("fecha");
fecha.value=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Montevideo"}).format(new Date());
function mostrarFechaCorta(){const [y,m,d]=fecha.value.split("-");fechaBtn.textContent=d+"/"+m}
mostrarFechaCorta();
fechaBtn.onclick=()=>{if(fecha.showPicker)fecha.showPicker();else fecha.click()};
const money=n=>"$"+Number(n||0).toLocaleString("es-UY");
async function cargar(){const {data,error}=await sb.from("appointments").select("id,customer_name,service,price,appointment_time,attendance_status").eq("appointment_date",fecha.value).order("appointment_time");if(error){msg.textContent=error.message;return}render(data||[])}
function render(rows){const lista=document.getElementById("lista");lista.innerHTML="";let total=0;for(const r of rows){if(r.attendance_status==="attended")total+=r.price;const d=document.createElement("div");d.className="turno "+r.attendance_status;const label=r.attendance_status==="attended"?"✅ FUE":r.attendance_status==="no_show"?"❌ NO FUE":"⏳ PENDIENTE";d.innerHTML='<div class="nombre"></div><div></div><div class="estado"></div>';d.children[0].textContent=r.customer_name;d.children[1].textContent=r.service+" · "+money(r.price);d.children[2].textContent=label;d.children[0].onclick=()=>cambiar(r);lista.appendChild(d)}document.getElementById("total").textContent="Total atendido: "+money(total)}
async function cambiar(r){const next=r.attendance_status==="pending"?"attended":r.attendance_status==="attended"?"no_show":"pending";const {error}=await sb.from("appointments").update({attendance_status:next}).eq("id",r.id);if(error){msg.textContent="Error: "+error.message;return}await cargar()}
async function sesion(){const {data}=await sb.auth.getSession();const on=!!data.session;login.classList.toggle("hide",on);panel.classList.toggle("hide",!on);if(on)cargar()}
document.getElementById("entrar").onclick=async()=>{loginMsg.textContent="Entrando...";const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:pass.value});loginMsg.textContent=error?error.message:"";if(!error)sesion()};
document.getElementById("salir").onclick=async()=>{await sb.auth.signOut();sesion()};fecha.onchange=()=>{mostrarFechaCorta();cargar()};
document.getElementById("cerrar").onclick=async()=>{msg.textContent="Cerrando caja...";const {data,error}=await sb.rpc("close_daily_cash",{p_date:fecha.value,p_type:"manual"});msg.textContent=error?"Error: "+error.message:"✅ Caja cerrada. Total: "+money(data.total_earned)+" · Atendidos: "+data.attended_count};
sb.auth.onAuthStateChange(()=>sesion());sesion();
</script></body></html>
