<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendar en el local | Maldivas_Studio</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;min-height:100vh;background:#080808;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.card{width:100%;max-width:520px;background:#111;border:1px solid #6f5b1d;border-radius:22px;padding:38px 25px;box-shadow:0 0 30px rgba(212,175,55,.08)}
h1{color:#d4af37;margin:0 0 10px;font-size:32px}.detalle{color:#ccc;margin-bottom:28px}
label{display:block;text-align:left;color:#d4af37;font-weight:bold;margin:0 0 9px}
input{width:100%;padding:15px 17px;border-radius:25px;border:1px solid #d4af37;background:#181818;color:#fff;font-size:17px;outline:none;margin-bottom:16px;color-scheme:dark}
button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:25px;background:#d4af37;color:#000;font-weight:bold;font-size:16px;cursor:pointer}
button:hover{background:#f0cf5a}.mensaje{display:none;margin-top:25px}.corazon{font-size:25px;animation:latido .8s ease-in-out infinite alternate}.mensaje h2{color:#d4af37;margin:8px 0}
.volver{display:inline-block;margin-top:25px;color:#d4af37;text-decoration:none}
@keyframes latido{to{transform:scale(1.2)}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YR99KQKFZ4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YR99KQKFZ4');
  </script>
</head>
<body>
<div class="card">
  <div id="formulario">
    <h1>Agendá tu cita</h1>
    <div class="detalle" id="detalle"></div>
    <p class="detalle">La cita se solicita por WhatsApp y queda pendiente de confirmación del local.</p>
    <label for="nombre">Tu nombre</label>
    <input id="nombre" type="text" placeholder="Escribí tu nombre" maxlength="60" autocomplete="name">
    <label for="fecha">Fecha</label>
    <input id="fecha" type="date" required>
    <label for="hora">Hora</label>
    <input id="hora" type="time">
    <button id="terminar">ENVIAR SOLICITUD POR WHATSAPP</button>
  </div>
  <a class="volver" href="Citas.html">← Volver a servicios</a>
</div>
<script>
const datos={
"corte":{nombre:"Corte",precio:"$500"},
"brushing":{nombre:"Brushing",precio:"Desde $490"},
"lavado":{nombre:"Lavado",precio:"$150"},
"alisado":{nombre:"Alisado",precio:"Desde $990"},
"color":{nombre:"Color",precio:"Desde $1.190"},
"mechas":{nombre:"Mechas",precio:"Desde $2.890"},
"balayage":{nombre:"Balayage",precio:"Desde $3.290"},
"botox":{nombre:"Botox",precio:"$1.190"},
"hidro":{nombre:"Hidro",precio:"$1.390"},
"liss-expert":{nombre:"Liss Expert",precio:"Desde $1.790"},
"extensiones":{nombre:"Mantenimiento de extensiones",precio:"$60 por mecha"},
"manos":{nombre:"Manos comunes",precio:"$300"},
"cejas":{nombre:"Depilación de cejas",precio:"$300"},
"bozo":{nombre:"Depilación de bozo",precio:"$200"},
"axila":{nombre:"Depilación sistema español · Axila",precio:"$290"},
"pierna":{nombre:"Depilación · Pierna entera",precio:"$450"},
"cavado":{nombre:"Depilación · Cavado",precio:"$290"},
"cavado-completo":{nombre:"Cavado completo con tira",precio:"$450"},
"cuerpo-entero":{nombre:"Súper promo cuerpo entero",precio:"$1.290"},
"perfilado":{nombre:"Perfilado de cejas",precio:"$490"}
};
const metodos={transferencia:"Transferencia",debito:"Débito",credito:"Crédito",efectivo:"Efectivo",mercadopago:"Mercado Pago"};
const p=new URLSearchParams(location.search);
const servicio=p.get("servicio")||"";
const metodo=p.get("metodo")||"";
document.getElementById("detalle").textContent=(datos[servicio]?.nombre||"Servicio")+" · "+(datos[servicio]?.precio||"")+" · Medio de pago"+(metodos[metodo]?" · "+metodos[metodo]:"");

async function finalizar(){
  const nombre=document.getElementById("nombre").value.trim();
  const fecha=document.getElementById("fecha").value;
  const hora=document.getElementById("hora").value;
  if(!nombre){alert("Escribí tu nombre.");document.getElementById("nombre").focus();return;}
  if(!fecha){alert("Elegí una fecha para tu cita.");document.getElementById("fecha").focus();return;}
  if(!hora){alert("Elegí una hora para tu cita.");document.getElementById("hora").focus();return;}
  const d=datos[servicio];
  const m=metodos[metodo];
  if(!d||!m){alert("No se pudo identificar el servicio o método de pago.");return;}
  const [y,mes,dia]=fecha.split("-");
  const mensaje="Hola Maldivas_Studio, quiero solicitar una cita.\nNombre: "+nombre+"\nServicio: "+d.nombre+"\nPrecio: "+d.precio+"\nFecha: "+dia+"/"+mes+"/"+y+"\nHora: "+hora+"\nMedio de pago: "+m;
  window.location.href="https://wa.me/59899017238?text="+encodeURIComponent(mensaje);
}
const fechaInput=document.getElementById("fecha");

document.getElementById("terminar").addEventListener("click",finalizar);
document.getElementById("nombre").addEventListener("keydown",(e)=>{if(e.key==="Enter"){e.preventDefault();finalizar();}});
</script>
</body>
</html>
