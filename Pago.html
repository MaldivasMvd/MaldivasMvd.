<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Medios de pago | Maldivas</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080808;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
    }

    .contenedor {
      width: 100%;
      max-width: 500px;
      background: #111;
      border: 1px solid #6f5b1d;
      border-radius: 20px;
      padding: 40px 25px;
    }

    h1 {
      color: #d4af37;
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      color: #bbb;
      margin-bottom: 30px;
    }

    .pago {
      display: block;
      width: 100%;
      padding: 18px;
      margin: 15px 0;
      border: 1px solid #d4af37;
      border-radius: 30px;
      background: #181818;
      color: #d4af37;
      text-decoration: none;
      font-weight: bold;
      font-size: 17px;
    }

    .pago:hover {
      background: #d4af37;
      color: #000;
    }

    .volver {
      display: inline-block;
      margin-top: 20px;
      color: #d4af37;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>MALDIVAS</h1>

    <p>Elegí tu medio de pago</p>

    <a href="#" class="pago">
      💳 DÉBITO
    </a>

    <a href="#" class="pago">
      💳 CRÉDITO
    </a>

    <a href="#" class="pago">
      🟡 MERCADO PAGO
    </a>

    <a href="#" class="pago">
      🏦 TRANSFERENCIA
    </a>

    <a href="Citas.html" class="volver">
      ← Volver a servicios
    </a>

  </div>

</body>
</html>
