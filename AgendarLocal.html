<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendar en el local | Maldivas_Studio</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;min-height:100vh;background:#080808;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.card{width:100%;max-width:520px;background:#111;border:1px solid #6f5b1d;border-radius:22px;padding:38px 25px;box-shadow:0 0 30px rgba(212,175,55,.08)}
h1{color:#d4af37;margin:0 0 10px;font-size:32px}.detalle{color:#ccc;margin-bottom:28px}
label{display:block;text-align:left;color:#d4af37;font-weight:bold;margin:0 0 9px}
input{width:100%;padding:15px 17px;border-radius:25px;border:1px solid #d4af37;background:#181818;color:#fff;font-size:17px;outline:none}
button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:25px;background:#d4af37;color:#000;font-weight:bold;font-size:16px;cursor:pointer}
button:hover{background:#f0cf5a}.mensaje{display:none;margin-top:25px}.corazon{font-size:25px;animation:latido .8s ease-in-out infinite alternate}.mensaje h2{color:#d4af37;margin:8px 0}
.volver{display:inline-block;margin-top:25px;color:#d4af37;text-decoration:none}
@keyframes latido{to{transform:scale(1.2)}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="card">
  <div id="formulario">
    <h1>Agendá tu cita</h1>
    <div class="detalle" id="detalle"></div>
    <label for="nombre">Tu nombre</label>
    <input id="nombre" type="text" placeholder="Escribí tu nombre" maxlength="60" autocomplete="name">
    <button id="terminar">TERMINAR</button>
  </div>
  <div class="mensaje" id="mensaje">
    <div class="corazon">♥</div>
    <h2>Te esperamos bella</h2>

  </div>
  <a class="volver" href="Citas.html">← Volver a servicios</a>
</div>
<script>
const datos={brushing:{nombre:"Brushing",precio:"$500"},corte:{nombre:"Corte",precio:"$300"},lavado:{nombre:"Lavado",precio:"$400"},secado:{nombre:"Secado",precio:"$450"},alisado:{nombre:"Alisado",precio:"$1500"},color:{nombre:"Color",precio:"$1800"}};
const metodos={transferencia:"Transferencia",debito:"Débito",credito:"Crédito",efectivo:"Efectivo"};
const p=new URLSearchParams(location.search);
const servicio=p.get("servicio")||"";
const metodo=p.get("metodo")||"";
document.getElementById("detalle").textContent=(datos[servicio]?.nombre||"Servicio")+" · "+(datos[servicio]?.precio||"")+" · Pago en el local"+(metodos[metodo]?" · "+metodos[metodo]:"");
const sb=supabase.createClient("https://ejbooxbgrtunoehcxxip.supabase.co","sb_publishable_xwYodv3gbRBhyKE1d_NEUw_le_jfPfq");
async function finalizar(){
  const nombre=document.getElementById("nombre").value.trim();
  if(!nombre){document.getElementById("nombre").focus();return;}
  const d=datos[servicio];
  const m=metodos[metodo];
  if(!d||!m){alert("No se pudo identificar el servicio o método de pago.");return;}
  const boton=document.getElementById("terminar");
  boton.disabled=true; boton.textContent="GUARDANDO...";
  const precio=Number(d.precio.replace("$",""));
  const {error}=await sb.from("appointments").insert({customer_name:nombre,service:d.nombre,price:precio,payment_method:m});
  if(error){console.error(error);alert("No se pudo guardar la cita. Intentá nuevamente.");boton.disabled=false;boton.textContent="TERMINAR";return;}
  document.getElementById("formulario").style.display="none";
  document.getElementById("mensaje").style.display="block";
}
document.getElementById("terminar").addEventListener("click",finalizar);
document.getElementById("nombre").addEventListener("keydown",(e)=>{if(e.key==="Enter"){e.preventDefault();finalizar();}});
</script>
</body>
</html>
