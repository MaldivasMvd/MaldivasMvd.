<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Servicio | Maldivas</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080808;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
    }

    .contenedor {
      width: 100%;
      max-width: 500px;
      background: #111;
      border: 1px solid #6f5b1d;
      border-radius: 20px;
      padding: 40px 25px;
    }

    h1 {
      color: #d4af37;
      font-size: 35px;
      margin-bottom: 30px;
    }

    .dato {
      font-size: 20px;
      margin: 20px 0;
    }

    .gold {
      color: #d4af37;
      font-weight: bold;
    }

    .boton {
      display: block;
      width: 100%;
      padding: 16px;
      margin-top: 18px;
      border-radius: 30px;
      background: #d4af37;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }

    .boton:hover {
      background: white;
    }

    .volver {
      display: inline-block;
      margin-top: 25px;
      color: #d4af37;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1 id="servicio">Servicio</h1>

    <div class="dato">
      💰 <span class="gold">Precio:</span>
      <span id="precio">$0</span>
    </div>

    <a href="#" class="boton">
      🏪 PAGAR EN LOCAL (EFECTIVO)
    </a>

    <a href="Pago.html" class="boton" target="_blank">
      💳 PAGAR POR WEB
    </a>

    <a href="Citas.html" class="volver">
      ← Volver a servicios
    </a>

  </div>

  <script>
    const datos = {
      brushing: {
        precio: "$500"
      },

      corte: {
        precio: "$600"
      },

      lavado: {
        precio: "$400"
      },

      secado: {
        precio: "$450"
      },

      alisado: {
        precio: "$1500"
      },

      color: {
        precio: "$1800"
      }
    };

    const parametros = new URLSearchParams(window.location.search);
    const servicio = parametros.get("servicio");

    if (datos[servicio]) {
      document.getElementById("servicio").textContent =
        servicio.charAt(0).toUpperCase() + servicio.slice(1);

      document.getElementById("precio").textContent =
        datos[servicio].precio;
    }
  </script>

</body>
</html>
